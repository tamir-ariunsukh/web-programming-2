<!doctype html>
<!-- lang="mn" — хуудасны хэл монгол гэдгийг хөтөчид мэдэгдэнэ -->
<html lang="mn">
  <head>
    <!-- UTF-8 — монгол кирилл үсгийг зөв харуулахад ЗААВАЛ -->
    <meta charset="UTF-8" />
    <!-- Дэлгэцийн хэмжээнд тохируулах (утасны харагдац) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Хөтчийн табын анхны гарчиг. 2-р дасгал дээр энэ гарчгийг
         useEffect-ээр төлвөөс хамааруулан өөрчлөхийг үзнэ. -->
    <title>Week 4 — useEffect ба амьдралын мөчлөг (лаборатор)</title>
  </head>
  <body>
    <!-- React бүх дэлгэцээ энэ ХООСОН САВ дотор зурна.
         main.jsx дотор document.getElementById('root') гэж энэ элементийг олж авна. -->
    <div id="root"></div>

    <!-- type="module" — орчин үеийн модуль системээр ажиллуулна.
         Vite энэ файлыг эхлэл (entry) болгон авч, доторх import-уудыг нэгтгэнэ. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
